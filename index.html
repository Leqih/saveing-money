<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Penny Round</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,900&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@500;900&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* layout: one phone-sized app column on an orange grid desk; sheets slide over the table */
:root {
  --desk: #FF4444; --desk-line: rgba(0,0,0,0.14);
  --paper: #FFFFFF; --ink: #111111; --sub: #5E5B54; --mute: #8A8A92; --rule: #E2E2E8;
  --cap: #EDEDF1; --cap-edge: #CFCFD6;
  --orange: #FF4B4B; --orange-edge: #D12E2E; --lime: #E4FF1A; --lime-edge: #B8D000;
  --pink: #FF4D6A; --purple: #A55BFF; --blue: #2E8BFF; --gold: #FFD000; --cobalt: #1F6BFF; --red: #FF3B1F; --yellow: #FFD54A; --lav: #DCD8FF;
  --receipt: #F5F3EC;
  --f-display: 'Archivo Black', 'Arial Black', sans-serif;
  --f-body: 'DM Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  --f-px: 'Pixelify Sans', 'IBM Plex Mono', monospace;
  --f-mono: var(--f-px);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--desk);
  background-image: linear-gradient(var(--desk-line) 1px, transparent 1px), linear-gradient(90deg, var(--desk-line) 1px, transparent 1px);
  background-size: 120px 120px;
  color: var(--ink); font-family: var(--f-body);
  display: flex; justify-content: center; align-items: flex-start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px;
  box-sizing: border-box;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.px { font-family: var(--f-px); }
/* iPhone 16 Pro mockup: 402 × 874 pt screen, black bezel, natural titanium band, side buttons, Dynamic Island */
:root { --top: 60px; }
.device { position: relative; flex-shrink: 0; padding: 14px; border-radius: 70px; background: linear-gradient(135deg, #DCD9D2 0%, #9C988F 22%, #CFCBC3 48%, #8E8A82 74%, #C8C4BC 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 2px 2px rgba(0,0,0,0.25), 0 40px 70px -24px rgba(0,0,0,0.55); }
.device::before { content: ""; position: absolute; inset: 4px; border-radius: 66px; background: #050506; }
.dbtn { position: absolute; width: 5px; border-radius: 3px; background: linear-gradient(90deg, #7A766F, #C9C5BD 55%, #8E8A82); }
.dbtn.l { left: -3px; } .dbtn.r { right: -3px; }
/* the side keys are shortcuts for reviewing the UI: the first press skips setup, later presses flip through the pages */
.dbtn.k { cursor: pointer; transition: filter 0.15s, transform 0.15s; }
.dbtn.k::after { content: ''; position: absolute; top: -6px; bottom: -6px; left: -9px; right: -9px; }
.dbtn.k:hover { filter: brightness(1.35) saturate(1.4); }
.dbtn.l.k:active { transform: translateX(2px); } .dbtn.r.k:active { transform: translateX(-2px); }
.dbtn.action { top: 168px; height: 36px; } .dbtn.vup { top: 232px; height: 64px; } .dbtn.vdown { top: 310px; height: 64px; }
.dbtn.power { top: 248px; height: 100px; }
.dbtn.cam { top: 560px; height: 62px; right: -2px; width: 4px; background: linear-gradient(90deg, #5E5A54, #A8A49C); }
.statusbar { position: absolute; left: 14px; right: 14px; top: 14px; height: 54px; z-index: 40; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 50px; border-radius: 55px 55px 0 0; }
/* the phone scrolls by touch, so no desktop scrollbar inside the screen */
.phone *, .phone { scrollbar-width: none; }
.phone ::-webkit-scrollbar { display: none; }
.statusbar { font-family: -apple-system, 'SF Pro Text', var(--f-body); font-weight: 700; font-size: 16px; color: var(--ink); }
.island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; }
.island::after { content: ""; position: absolute; right: 13px; top: 12px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2A3346 0%, #0B0E15 60%); }
.sb-icons { display: flex; align-items: center; gap: 6px; }
.homebar { position: absolute; left: 50%; bottom: 22px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: #111; z-index: 41; pointer-events: none; }
.phone { position: relative; width: 402px; height: 874px; background: var(--paper); border-radius: 55px; overflow: hidden; }
/* once the home screen scrolls, the top row folds into a compact title bar pinned under the status bar */
.minibar { position: absolute; left: 0; right: 0; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(var(--top) - 4px) 18px 10px; background: var(--paper); box-shadow: 0 10px 18px -12px rgba(20,20,30,0.4); border: 0; width: 100%; text-align: left; opacity: 0; transform: translateY(-12px); pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; }
#app.scrolled .minibar { opacity: 1; transform: none; pointer-events: auto; }
.minibar .mt { font-family: var(--f-px); font-size: 14px; font-weight: 600; }
.minibar .mr { display: flex; align-items: center; gap: 6px; }
.minibar .mm { height: 28px; padding: 0 10px; border-radius: 14px; background: #C9C3FF; color: #2B2470; font-family: var(--f-display); font-size: 14px; display: flex; align-items: center; }
.minibar .ms { height: 28px; padding: 0 10px; border-radius: 14px; background: var(--ink); color: var(--lime); font-family: var(--f-px); font-size: 12px; display: flex; align-items: center; }
/* sheets keep their title and close button pinned the same way */
.sheet .bar-top { position: sticky; top: calc(-1 * var(--top)); z-index: 6; margin: calc(-1 * var(--top)) -18px 0; padding: calc(var(--top) - 4px) 18px 10px; background: var(--paper); transition: box-shadow 0.18s ease; }
.sheet.scrolled .bar-top { box-shadow: 0 10px 18px -12px rgba(20,20,30,0.4); }
.screen { height: 100%; overflow-y: auto; padding: var(--top) 18px 110px; display: flex; flex-direction: column; gap: 14px; }
.screen > * { flex-shrink: 0; }

/* keycap */
.cap { border: 0; border-radius: 16px; padding: 4px 4px 10px; background: var(--cap-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -2px 0 rgba(0,0,0,0.18), 0 14px 18px -8px rgba(20,20,30,0.32); transition: transform 0.08s ease; display: block; width: 100%; text-align: left; }
.cap > .top { position: relative; height: 100%; border-radius: 12px; background: linear-gradient(180deg, #FAFAFC 0%, var(--cap) 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.75), inset 0 -3px 5px rgba(0,0,0,0.08); padding: 10px 14px; }
button.cap:active { transform: translateY(3px); }
.cap.orange { background: var(--orange-edge); } .cap.orange > .top { background: linear-gradient(180deg, #FF7A7A 0%, var(--orange) 100%); }
.cap.lime { background: var(--lime-edge); } .cap.lime > .top { background: linear-gradient(180deg, #F2FF7A 0%, var(--lime) 100%); }
.cap.dark { background: #47474B; } .cap.dark > .top { background: linear-gradient(180deg, #6A6A70 0%, #5B5B60 100%); color: #F4F4F4; }
.cap[disabled] { opacity: 0.45; cursor: not-allowed; }
.bigbtn > .top { text-align: center; font-weight: 900; font-size: 16px; padding: 14px; }

/* header */
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.daypill { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 18px; background: #26262B; color: #F2F2F5; min-width: 0; flex: 1; }
.dots { display: flex; justify-content: space-between; font-family: var(--f-px); font-size: 11px; color: #8A8A92; }
.dots b { font-weight: 400; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.dots b.now { background: var(--orange); color: #fff; }
.help { width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #26262B; color: #fff; font-family: var(--f-display); font-size: 16px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4); }
.cookie { width: 66px; height: 66px; flex-shrink: 0; border: 0; padding: 0; background: #C9C3FF; color: #2B2470; display: flex; flex-direction: column; align-items: center; justify-content: center; clip-path: polygon(100% 50%,91.5% 61.1%,93.3% 75%,80.4% 80.4%,75% 93.3%,61.1% 91.5%,50% 100%,38.9% 91.5%,25% 93.3%,19.6% 80.4%,6.7% 75%,8.5% 61.1%,0% 50%,8.5% 38.9%,6.7% 25%,19.6% 19.6%,25% 6.7%,38.9% 8.5%,50% 0%,61.1% 8.5%,75% 6.7%,80.4% 19.6%,93.3% 25%,91.5% 38.9%); }
.cookie .n { font-family: var(--f-px); font-size: 20px; font-weight: 600; line-height: 1; }
.cookie .l { font-size: 11px; font-weight: 900; }

/* this week's rule: a ticket with punched notches */
.rulebar { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; width: 100%; border: 0; text-align: left; padding: 12px 18px 12px 14px; border-radius: 22px; background: #26262B; color: #F2F2F5;
  -webkit-mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat;
          mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat; }
.rulebar:active { transform: translateY(2px); }
.rmini { width: 72px; height: 102px; }

.rtext { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rtext small { font-family: var(--f-px); font-size: 12px; color: var(--lime); }
.rtext b { font-size: 20px; font-weight: 900; line-height: 1.15; }
.rtext span { font-size: 12px; line-height: 1.45; color: rgba(242,242,245,0.8); }
.rtext em { font-style: normal; font-family: var(--f-px); font-size: 12px; color: #FF9A6A; }
.rtext em.good { color: var(--lime); }

.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 900; font-size: 14px; }
.bar { height: 12px; margin-top: 8px; border-radius: 3px; background: repeating-linear-gradient(90deg, #D8D8DE 0 15px, transparent 15px 18px); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, #5B4FC8 0 15px, transparent 15px 18px); transition: width 0.6s ease; }
.bar.over i { background: repeating-linear-gradient(90deg, var(--red) 0 15px, transparent 15px 18px); }
.hint { margin: 8px 0 0; font-size: 12px; line-height: 1.55; color: var(--sub); font-weight: 500; }
.hint b { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 10px; }
.tile { height: 42px; border-radius: 9px; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: var(--f-px); font-size: 11px; background: #fff; box-shadow: inset 0 -3px 0 #D8D8DE; color: var(--ink); }
.tile b { font-weight: 400; font-size: 11px; }
button.tile:active { transform: translateY(2px); }
.tile.now { background: var(--orange); color: #fff; box-shadow: inset 0 -3px 0 var(--orange-edge); }
.tile.future { background: transparent; box-shadow: none; border: 1.5px dashed var(--cap-edge); color: var(--mute); }
.tile.hit { box-shadow: inset 0 -3px 0 #FFB3A6; }
.tile.zero { box-shadow: inset 0 -3px 0 var(--lime-edge); }

.hero > .top { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
.hero .money { font-family: var(--f-display); font-size: 64px; line-height: 0.95; }
.hero .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero.over > .top { background: linear-gradient(180deg, #FF7BE3 0%, #FF52D9 100%); }
.hero.over { background: #D43AB4; }

h2 { margin: 0; font-weight: 900; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-weight: 500; font-size: 12px; color: var(--mute); }
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--rule); font-size: 12px; background: #fff; white-space: nowrap; }
.chip b { font-family: var(--f-px); font-weight: 400; }
.chip.ess { color: var(--mute); }
.chip.hot { border-color: var(--orange); }
.chip.hit { border-color: var(--pink); background: #FFF0F2; }
.chip.hit b { color: #C8102E; }
button.chip:active { transform: translateY(2px); }

.wish { border-radius: 24px; background: var(--cobalt); color: #fff; padding: 14px 16px; box-shadow: 0 8px 0 #1546B0; display: flex; flex-direction: column; gap: 10px; }
.wish .two { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; }
.wish .cap > .top { color: var(--ink); text-align: center; font-weight: 900; font-size: 14px; padding: 12px 8px; }

.dock { position: absolute; left: 14px; right: 14px; bottom: 16px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; z-index: 5; }
.dock .cap > .top { text-align: center; font-weight: 900; font-size: 16px; padding: 14px; }
.dock .log { border: 0; border-radius: 32px; background: var(--cobalt); color: #fff; font-weight: 900; font-size: 16px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 10px 18px -6px rgba(31,107,255,0.5); }

/* sheets */
.sheet { position: absolute; inset: 0; background: var(--paper); z-index: 10; overflow-y: auto; padding: var(--top) 18px 24px; display: flex; flex-direction: column; gap: 14px; animation: up 0.25s ease; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .bar-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h1 { margin: 0; font-weight: 900; font-size: 20px; }
.x { width: 44px; height: 44px; flex-shrink: 0; border-radius: 15px; border: 0; padding: 0; background: var(--ink); color: var(--lime); display: flex; align-items: center; justify-content: center; transform: rotate(-4deg); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.45), 0 6px 10px -4px rgba(20,20,30,0.4); transition: transform 0.12s ease; }
.x:hover { transform: rotate(4deg) scale(1.05); } .x:active { transform: rotate(0) scale(0.94); }
/* a chunky label stuck on a card or box: ink on lime, like the stamps */
.sticker { position: absolute; z-index: 2; padding: 2px 10px; border-radius: 10px; background: var(--lime); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-size: 12px; font-weight: 900; white-space: nowrap; transform: rotate(6deg); }
.lbl { font-size: 12px; font-weight: 900; color: var(--sub); margin-bottom: -4px; }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.amount { border-radius: 28px 60px 60px 28px; background: var(--lav); padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; }
.amount b { font-family: var(--f-display); font-weight: 400; font-size: 44px; color: #2B2470; line-height: 1; }
.field { display: flex; gap: 6px; }
.in { flex: 1; min-width: 0; height: 44px; border-radius: 14px; border: 2px solid var(--rule); padding: 0 14px; font: inherit; font-size: 14px; background: #fff; color: var(--ink); }
.in:focus { outline: none; border-color: var(--cobalt); }
.mini { height: 44px; padding: 0 12px; border-radius: 14px; border: 2px solid var(--ink); background: #fff; font-weight: 900; font-size: 12px; white-space: nowrap; }
.mini[disabled] { opacity: 0.35; cursor: not-allowed; }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cats .cap > .top { text-align: center; font-weight: 900; font-size: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; }
.cats .cap[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.cats .cap small { font-weight: 500; font-size: 11px; color: var(--sub); }
.newcat { border-radius: 18px; background: #F3F3F6; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.toggle { display: flex; gap: 6px; }
.toggle button { flex: 1; height: 38px; border-radius: 19px; border: 2px solid var(--rule); background: #fff; font-weight: 900; font-size: 12px; }
.toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.impact { border-radius: 22px; background: var(--ink); color: #fff; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-family: var(--f-px); font-size: 14px; }
.impact .r { display: flex; justify-content: space-between; gap: 10px; }
.impact .r span:first-child { color: rgba(255,255,255,0.7); white-space: nowrap; }
.impact .r span:last-child { text-align: right; }
.impact .hot { color: #FF7A7A; }
.impact .good { color: var(--lime); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad .cap { height: 54px; padding: 3px 3px 8px; }
.pad .cap > .top { display: flex; align-items: center; justify-content: center; font-family: var(--f-px); font-size: 20px; padding: 0; }
.actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.actions .cap > .top { text-align: center; font-weight: 900; font-size: 14px; padding: 14px 6px; }
.go { border: 0; border-radius: 30px; background: var(--cobalt); color: #fff; font-weight: 900; font-size: 16px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); min-height: 52px; }
.go[disabled] { opacity: 0.4; cursor: not-allowed; }
.note { font-size: 12px; line-height: 1.6; color: var(--sub); text-align: center; margin: 0; }
.note.left { text-align: left; }
.pillrow { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 10px; border-radius: 12px; border: 2px solid var(--rule); font-size: 12px; font-weight: 900; color: var(--sub); background: #fff; }
.pill.ok { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.pill.mid { background: #FFF3C2; border-color: #FFE07A; color: #6A4A00; }
.pill.no { background: #FFE1E1; border-color: #FFC2C2; color: #A10F0F; }
.stars { font-family: var(--f-mono); letter-spacing: 1px; }

.pickinfo { border-radius: 24px; background: #F3F3F6; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.pickinfo h3 { margin: 0; font-size: 20px; font-weight: 900; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pickinfo p { margin: 0; font-size: 14px; line-height: 1.55; }

/* receipt */
.receipt { position: relative; background: var(--receipt); border-radius: 18px 18px 0 0; padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-bottom: 12px; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: linear-gradient(135deg, var(--receipt) 50%, transparent 50%) 0 0 / 14px 10px repeat-x, linear-gradient(-135deg, var(--receipt) 50%, transparent 50%) 0 0 / 14px 10px repeat-x; }
.receipt .r { display: flex; justify-content: space-between; gap: 10px; }
.receipt .r span:last-child { font-family: var(--f-px); white-space: nowrap; }
.receipt .r i { font-style: normal; font-size: 11px; padding: 1px 5px; border-radius: 5px; background: #E2E0D8; color: var(--sub); margin-left: 4px; }
.receipt .r i.hit { background: var(--pink); color: #fff; }
.receipt .off { color: var(--mute); }
.receipt .hitc { color: #C8102E; }
.receipt hr { border: 0; border-top: 2px dashed #CFCCC2; margin: 6px 0; width: 100%; }
.receipt .cap-t { font-family: var(--f-mono); font-size: 11px; color: var(--sub); padding-right: 90px; }
.receipt .tot { display: flex; justify-content: space-between; align-items: baseline; }
.receipt .tot b { font-family: var(--f-display); font-weight: 400; font-size: 28px; }
.stamp { position: absolute; right: 14px; top: 12px; transform: rotate(8deg); padding: 4px 10px; border: 3px solid var(--ink); border-radius: 10px; font-weight: 900; font-size: 12px; background: var(--lime); }
.stamp.hit { background: #FFD0D8; }
.stamp.no { background: #FFE1E1; }
.bigstamp { align-self: center; padding: 10px 26px; border: 4px solid var(--ink); border-radius: 18px; font-weight: 900; font-size: 28px; transform: rotate(-5deg); background: var(--lime); box-shadow: 0 8px 0 rgba(0,0,0,0.12); }
.bigstamp.no { background: #FFE1E1; }

/* rule sheet: the launch screen's sticker collage, then the details as gently tilted candy cards */
/* rule card page: the sheet takes the card's colour, a big card flips over to show its rule, a drawer holds the rest */
.sheet.rulec { background: var(--rc); gap: 0; padding-bottom: 0; }
.sheet.rulec .bar-top { background: transparent; box-shadow: none; }
.sheet.rulec .bar-top h1 { color: #FFF; }
.rstage { position: relative; flex: 1 0 auto; min-height: 600px; display: flex; align-items: center; justify-content: center; perspective: 1100px; }
.rflip { position: relative; width: 360px; height: 510px; padding: 0; border: 0; background: none; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.3,1.25,.5,1); }
.rflip.back { transform: rotateY(180deg); }

/* Entries ledger: category filter chips, then one white card per day with a row per expense */
/* Deck: the next unlock / last week as a tappable row under the tabs */
.dk-next { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 2px solid var(--rule); border-radius: 20px; background: #FFF; text-align: left; color: var(--ink); }

.push { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 40; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 12px; border-radius: 22px; background: #FAFAFC; border: 1px solid #E2E2E8; box-shadow: 0 16px 30px rgba(0,0,0,0.28); animation: drop 0.3s ease; }

.clocks { display: flex; flex-direction: column; gap: 8px; }

.ystat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ystat div { border-radius: 12px; background: #fff; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.ystat small { font-size: 11px; font-weight: 900; color: var(--sub); }
.ystat b { font-family: var(--f-px); font-weight: 400; font-size: 16px; }
.rv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,0.14); font-size: 14px; }
.rv > span:last-child { display: flex; gap: 6px; flex-shrink: 0; }
.rvbtn { height: 34px; padding: 0 12px; border: 0; border-radius: 12px; background: #fff; color: #111; font-weight: 900; font-size: 12px; }
.rvbtn.lime { background: var(--lime); }
/* held cards on home: three small cards and the multiplier they add up to */
.hold { display: grid; gap: 8px; align-items: center; }
.hcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font-size: 11px; font-weight: 900; color: var(--ink); }
.hcard > span { padding: 1px 8px; border-radius: 8px; background: #EDEDF1; white-space: nowrap; }
.hcard.on > span { background: var(--lime); }
.hcard.broken > span { background: #FFD0D8; color: #A10F2E; }
.hcard.broken > div { animation: crack 0.5s ease; }
.hcard.glow > div { animation: glow 0.9s ease; }
@keyframes crack { 0%, 100% { transform: none; } 20% { transform: rotate(-6deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } }
@keyframes glow { 0% { filter: none; } 40% { filter: drop-shadow(0 0 10px #E4FF1A) brightness(1.08); } 100% { filter: none; } }
button.hcard:active > div { transform: translateY(2px); }
.multc { justify-self: center; width: 84px; height: 84px; background: #C9C3FF; color: #2B2470; display: flex; flex-direction: column; align-items: center; justify-content: center; clip-path: polygon(100% 50%,91.5% 61.1%,93.3% 75%,80.4% 80.4%,75% 93.3%,61.1% 91.5%,50% 100%,38.9% 91.5%,25% 93.3%,19.6% 80.4%,6.7% 75%,8.5% 61.1%,0% 50%,8.5% 38.9%,6.7% 25%,19.6% 19.6%,25% 6.7%,38.9% 8.5%,50% 0%,61.1% 8.5%,75% 6.7%,80.4% 19.6%,93.3% 25%,91.5% 38.9%); }
.multc small { font-size: 11px; font-weight: 900; }
.multc b { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1; }
.hold-lbl { font-size: 12px; font-weight: 900; color: var(--sub); margin-bottom: -4px; }
/* deal of five: two rows, picked cards lift and get a number */
.draw-lead { margin: -4px 0 0; font-size: 14px; font-weight: 900; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.drawfoot { position: sticky; bottom: -24px; z-index: 3; margin: auto -18px -24px; padding: 14px 18px 22px; background: #FFF; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 24px rgba(20,20,30,0.1); display: flex; flex-direction: column; gap: 10px; }
.dsum { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; font-size: 12px; color: var(--sub); }
.dsum b { font-family: var(--f-display); font-weight: 400; font-size: 16px; color: var(--ink); }
.dslots { display: flex; gap: 6px; }
.dslot { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); }
.dslot.empty { border: 2px dashed #C4C4CC; background: #F6F6F8; }
/* draw: a sealed pack tears open and the cards fan out of it like a hand */
.hand { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; min-height: 372px; margin: 0 -18px; overflow: hidden; }
.hand:has(.stack.dragging), .hand:has(.sc2.flying) { overflow: visible; position: relative; z-index: 2; }
.hand-in { position: relative; flex-shrink: 0; width: 100%; height: 372px; }
.hand.open { min-height: 441px; } .hand.open .hand-in { height: 441px; }
.bag.closed { cursor: grab; touch-action: none; } .bag.tearing-drag { cursor: grabbing; }
.bag.tearing-drag .bag-strip { transition: none; }
.bag-strip { transition: transform 0.45s cubic-bezier(.3,1.7,.5,1); }
/* the bag: closed it stands tall in the middle; opened it sits low and open with the cards fanned out of it */
.bag { position: absolute; z-index: 20; left: 50%; top: 44px; width: 240px; height: 318px; margin-left: -120px; padding: 56px 0 60px; border: 0; background: none; font: inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.7s cubic-bezier(.3,1.7,.5,1); }
.bag.closed:not(.tilt):not(.tearing-drag) { animation: bagFloat 3.2s ease-in-out infinite; }
@keyframes bagFloat { 50% { margin-top: -8px; } }
.bag.tilt { transition: transform 0.12s ease-out; }
.bag svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bag-strip { transform-origin: 96% 16%; }
@keyframes blink { 0%, 92%, 100% { transform: none; } 95% { transform: scaleY(0.1); } }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% + 10px)); } }
.bag .pk-arrow { inset: auto; left: 22px; top: 74px; width: 30px; height: 30px; z-index: 1; }
.pk-badge { position: absolute; right: -14px; top: 30px; z-index: 4; width: 76px; height: 76px; border-radius: 50%; background: #3DCBFF; display: flex; align-items: center; justify-content: center; }
.bag .pk-badge svg { position: static; width: 62px; height: 62px; display: block; }
.pk-face { transform: translate(var(--ex, 0px), var(--ey, 0px)); transition: transform 0.2s; }
.pk-labs { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; align-self: stretch; gap: 0; padding: 0 0 0 22px; margin-top: 54px; font-family: var(--f-mono); }
.pk-lab { display: inline-block; background: #FFF; color: #111; padding: 2px 9px; font-size: 12px; line-height: 1.35; }
.pk-lab:nth-child(2) { margin-left: 12px; } .pk-lab:nth-child(3) { margin-left: 4px; }
.pk-title { font-family: var(--f-body); font-weight: 900; font-size: 28px; line-height: 1.2; letter-spacing: 1px; }
.pk-tear { position: absolute; z-index: 2; left: 50%; top: 390px; padding: 3px 14px; background: #A4FF2E; color: #111; font-family: var(--f-mono); font-size: 12px; font-weight: 500; white-space: nowrap; transform: translateX(-50%); animation: nudge 1.6s ease-in-out infinite; pointer-events: none; }
.pk-tear.shake { animation: hintShake 0.4s ease; }
@keyframes hintShake { 25% { transform: translateX(calc(-50% - 8px)); } 75% { transform: translateX(calc(-50% + 8px)); } }
/* tearing: the strip peels off and flies, the bag squishes */
.hand.tearing .bag-strip { animation: peel 0.5s cubic-bezier(.5,0,.7,1) forwards; }
@keyframes peel { 30% { transform: rotate(-9deg) translate(-4px, -8px); } 100% { transform: translate(170px, -190px) rotate(75deg); opacity: 0; } }
.hand.tearing .bag { animation: squish 0.46s ease; }
@keyframes squish { 25% { transform: scale(1.06, 0.92); } 55% { transform: scale(0.96, 1.05); } 100% { transform: none; } }
.hand.tearing .pk-tear { opacity: 0; transition: opacity 0.15s; }
.hand.tearing .bag::after { content: ''; position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(228,255,26,0.5) 40%, transparent 70%); opacity: 0; animation: flash 0.5s ease-out; pointer-events: none; }
@keyframes flash { 30% { opacity: 1; } 100% { opacity: 0; } }
.hand.dealing .stack::before { content: ''; position: absolute; left: 50%; top: 150px; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; background: radial-gradient(circle, rgba(228,255,26,0.7), transparent 65%); animation: flash 0.9s ease-out forwards; pointer-events: none; }
/* open: the bag drops low; a dark mouth sits behind the cards so they look tucked inside */
.burst { position: absolute; left: 50%; top: 150px; z-index: 25; pointer-events: none; }
.cf { position: absolute; left: 0; top: 0; opacity: 0; animation: confetti 1.15s cubic-bezier(.15,.7,.4,1) forwards; animation-delay: var(--cd); }
@keyframes confetti { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 45% { opacity: 1; transform: translate(var(--cx), var(--cy)) rotate(var(--cr)); } 100% { opacity: 0; transform: translate(calc(var(--cx) * 1.25), calc(var(--cy) + 280px)) rotate(calc(var(--cr) * 2)); } }
/* the stack: positions come from layoutStack(), CSS only animates between them */
/* shared page skeleton: one header row height, one rhythm between blocks, one corner radius for content cards (the showpieces keep their own shapes) */
.sheet .bar-top > * { min-height: 44px; display: flex; align-items: center; }
.sheet .bar-top { align-items: center; }
.sheet .impact, .sheet .rc, .sheet .mhero, .sheet .sglue, .sheet .smine, .sheet .gradcard, .sheet .cv-ticket, .sheet .set-row, .sheet .receipt, .dk-next, .screen .cap.meter .top { border-radius: 22px; }
/* Deck and Ledger open with the same header row: one height, title centred in it */
.screen:not(:has(> .head)) > :first-child { min-height: 56px; align-items: center; }
/* dragging the pack or a card shouldn't highlight text */
.bag, .hand, .stack, .sc2, .drawfoot, .dkc-count { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.stack { position: absolute; left: 0; right: 0; top: 0; height: 441px; overflow: visible; touch-action: none; cursor: grab; }
.stack.dragging { cursor: grabbing; }
.sc2 { position: absolute; left: 50%; top: -16px; width: 300px; height: 425px; margin-left: -150px; border: 0; padding: 0; background: none; transition: transform 0.38s cubic-bezier(.25,1.3,.5,1), opacity 0.2s; }
.stack.dragging .sc2, .stack.gliding .sc2 { transition: none; }
.stack.settle .sc2 { transition: transform 0.6s cubic-bezier(.22,1,.36,1) var(--sd, 0ms), opacity 0.2s; }
.stack.slide1 .sc2.front { animation: slideR 0.62s cubic-bezier(.2,1.3,.4,1) both; }
.stack.slide-1 .sc2.front { animation: slideL 0.62s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes slideR { from { transform: translate(330px, 0) scale(0.93); } }
@keyframes slideL { from { transform: translate(-330px, 0) scale(0.93); } }
.sc2-face { width: 240px; height: 340px; transform: scale(1.25); transform-origin: 0 0; pointer-events: none; }
.sc2-edge { position: absolute; inset: 0; border-radius: 30px; pointer-events: none; opacity: 1; transition: opacity 0.3s; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.12); }
.sc2.front .sc2-edge { opacity: 0; }

.sc2:not(.front) { pointer-events: none; }
.sc2-face > div { box-shadow: none !important; }
.sc2:not(.front) .carry-tag, .sc2:not(.front) .sc2-rec { display: none; }
.sc2.front { animation: hover 3s ease-in-out infinite; }
@keyframes hover { 50% { margin-top: -5px; } }

.sc2.flying { transition: none; animation: none; z-index: 90 !important; }

.sc2-pickhint { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); z-index: 3; padding: 3px 14px; border-radius: 14px; background: #111; color: var(--lime); font-size: 12px; font-weight: 900; white-space: nowrap; pointer-events: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.07); } }
/* the card itself: a saturated panel with the mascot, name, tags and rule text, like a collectible */
.dkc { position: relative; width: 100%; height: 100%; border-radius: 30px; padding: 16px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; overflow: hidden; pointer-events: none; }
.dkc::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,0.28), transparent 38%, rgba(0,0,0,0.12)); }
.dkc-top { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
.dkc-pill { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 13px; background: rgba(0,0,0,0.2); font-size: 12px; font-weight: 900; white-space: nowrap; }
.dkc-art { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; filter: drop-shadow(0 14px 10px rgba(0,0,0,0.28)); }
.dkc-name { margin: 0; font-size: 28px; font-weight: 500; letter-spacing: 1px; line-height: 1.1; }
.dkc-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dkc-desc { margin: 0; font-size: 12px; line-height: 1.55; opacity: 0.92; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; min-height: 82px; }
.dkc-count.bounce { animation: cbounce 0.6s cubic-bezier(.3,1.9,.5,1); }
.sheet .bar-top h1 { min-width: 0; flex: 1 1 0; }
.chipk, .dkc-count { flex: none; white-space: nowrap; }
.dsum-rec { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.dkc-count { margin-left: auto; margin-right: 0; padding: 2px 10px; border-radius: 12px; background: rgba(17,17,17,0.08); color: var(--ink); font-size: 12px; font-weight: 900; }
/* the draw screen goes dark and takes on the colour of the card in front */
.sheet.drawdark { background: var(--tint, #FFF); overflow-x: hidden; color: var(--ink); transition: background 0.4s; }
.drawdark .bar-top { background: var(--tint, #FFF); transition: background 0.4s; }
.drawdark .bar-top h1 { color: var(--ink); }
.drawdark .draw-lead { color: var(--sub); }
.drawdark .drawfoot { z-index: 6; background: #D9D9DE; box-shadow: none; border-radius: 30px 30px 0 0; padding: 8px 8px 22px; gap: 8px; }

.deck-plate { transition: background 0.4s, color 0.4s, transform 0.25s cubic-bezier(.3,1.6,.5,1); }

.chipk { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 9px; border: 2px solid #111; font-size: 12px; font-weight: 900; white-space: nowrap; vertical-align: middle; }
.stakes { display: flex; flex-direction: column; gap: 6px; }

/* notices: a bell with an unseen count in the header, the list in its own sheet */

.push { cursor: pointer; }

.ibtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

.rec-tag { position: absolute !important; left: 50%; top: -14px; transform: translateX(-50%) rotate(-4deg); margin: 0 !important; padding: 1px 10px; border-radius: 10px; background: #FFE04A; border: 3px solid #FFC800; font-size: 12px !important; white-space: nowrap; }
.sband { position: relative; padding-top: 18px; transform: rotate(-2deg); margin-top: 4px; }

.sbtns .sub { font-size: 12px; color: #6B7A00; } .sbtns .sub s { color: #A9B84A; }
.sglue { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 20px; background: #F3F3F6; }

.sbubble { position: relative; height: 122px; margin-top: 6px; }
.sbubble svg { position: absolute; left: 0; top: 0; }
.sstar { position: absolute; right: 2px; top: -12px; width: 70px; height: 70px; background: #00C2FF; clip-path: polygon(50% 0%,58% 22%,79% 9%,74% 33%,98% 32%,80% 49%,98% 66%,74% 66%,79% 91%,58% 78%,50% 100%,42% 78%,21% 91%,26% 66%,2% 66%,20% 49%,2% 32%,26% 33%,21% 9%,42% 22%); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; }
.stext { position: absolute; left: 28px; right: 70px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
.stext b { font-size: 16px; font-weight: 900; } .stext span { font-size: 12px; line-height: 1.45; color: #3A1020; }
/* end-of-day scoring stage */
.stage-orbs { display: flex; align-items: center; justify-content: center; gap: 8px; }
.stage-orbs { align-self: stretch; justify-content: space-evenly; }
.stage-orbs .blob { width: 122px; height: 122px; } .stage-orbs .blob b { font-size: 46px; } .stage-orbs .blob span { font-size: 12px; padding: 0 10px; }
/* base score and multiplier are two round signal lamps in one housing */
.stage-orbs { padding: 16px 18px 12px; margin: 0 auto; border-radius: 70px; background: linear-gradient(180deg, #3A3A40, #131316); box-shadow: inset 0 0 0 3px #4C4C54, 0 6px 0 #08080A, 0 18px 22px -10px rgba(0,0,0,0.55); gap: 6px; position: relative; }
.stage-orbs::after { content: ""; position: absolute; left: 50%; bottom: -16px; width: 22px; height: 14px; margin-left: -11px; background: #2A2A30; border-radius: 0 0 4px 4px; z-index: -1; }
.stage-orbs .blob::before { border-radius: 50%; background-image: radial-gradient(circle at 34% 28%, rgba(255,255,255,0.7) 0, rgba(255,255,255,0) 32%), radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18) 0, rgba(255,255,255,0) 70%); box-shadow: inset 0 -7px 0 rgba(0,0,0,0.22), inset 0 0 0 5px rgba(0,0,0,0.18), 0 0 26px 2px rgba(46,139,255,0.7); }
.stage-orbs .blob.m::before { border-radius: 50%; box-shadow: inset 0 -7px 0 rgba(0,0,0,0.22), inset 0 0 0 5px rgba(0,0,0,0.18), 0 0 26px 2px rgba(255,79,160,0.75); }
.stage-orbs .blob::after { content: ""; position: absolute; left: -7%; right: -7%; top: -10px; height: 48%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; border-top: 8px solid #0B0B0D; pointer-events: none; }
.stage-orbs .stage-x { color: #FFF; }
.blob { position: relative; width: 120px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FFF; text-align: center; }
.blob::before { content: ""; position: absolute; inset: 0; border-radius: 46% 54% 40% 60% / 52% 44% 56% 48%; background-color: #2E8BFF; background-image: radial-gradient(rgba(255,255,255,0.6) 0.8px, transparent 1px); background-size: 5px 5px; box-shadow: 0 0 30px rgba(46,139,255,0.5); }
.blob.m::before { background-color: #FF4FA0; border-radius: 36% 64% 58% 42% / 40% 50% 50% 60%; box-shadow: 0 0 30px rgba(255,79,160,0.5); }
.blob b { position: relative; font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1.05; }
.blob span { position: relative; font-size: 11px; font-weight: 900; padding: 0 10px; }
.stage-x { font-family: var(--f-display); font-size: 28px; }
.stage-cards { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px 16px; }
.stage-cards .sc { position: relative; }
.sc-tag { position: absolute; left: 50%; bottom: -12px; padding: 2px 10px; border: 2px solid var(--ink); border-radius: 12px; font-size: 12px; font-weight: 900; white-space: nowrap; transform: translateX(-50%) scale(0); transition: transform 0.3s cubic-bezier(.3,1.9,.5,1); background: var(--lime); color: var(--ink); z-index: 2; }
.sc-tag.on { transform: translateX(-50%) scale(1); }
.sc-tag.bad { background: var(--pink); color: #FFF; }
.impact.lines .r span:first-child { white-space: normal; min-width: 0; }
.impact.lines .r span:last-child { white-space: nowrap; flex: none; }
.stage-cards .dim { opacity: 0.55; }
.stage-cards .pop { animation: pop2 0.5s ease; filter: drop-shadow(0 0 10px #E4FF1A); }
.lines:empty { display: none; }
.lines .r { animation: up 0.2s ease; font-size: 12px; }
.impact .r.off span { color: rgba(255,255,255,0.45); }
.impact .r.sum { margin-top: 4px; padding-top: 8px; border-top: 1.5px dashed rgba(255,255,255,0.25); }
.impact .r.sum span { color: var(--lime); }
.score-oval { align-self: center; min-width: 250px; height: 118px; padding: 0 28px; border-radius: 59px; background: var(--yellow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform: rotate(-4deg); color: #2A2205; box-shadow: 0 12px 22px rgba(20,20,30,0.18); margin: 2px 0 4px; }
.score-oval small { font-family: var(--f-px); font-size: 14px; letter-spacing: 1px; opacity: 0.75; }
.score-oval b { font-family: var(--f-display); font-weight: 400; font-size: 64px; line-height: 1; }
.unlogged { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 22px; background: #111; color: #FFF; }
.unlogged b { font-size: 16px; } .unlogged span { font-size: 12px; line-height: 1.55; color: rgba(255,255,255,0.8); }
/* log sheet: verdict and save pinned to the bottom */
.logfoot { position: sticky; bottom: -24px; z-index: 2; margin: 4px -18px -24px; padding: 12px 18px 22px; background: #FFF; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 24px rgba(20,20,30,0.1); display: flex; flex-direction: column; gap: 10px; }
/* the live preview: a dark ticket whose star badge shows the multiplier you'll end up with */
.vline { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 22px; color: #FFF; background: linear-gradient(180deg, #1E1E22 0%, #0E0E11 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 14px 20px -12px rgba(20,20,30,0.5); }
.vtext { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.vtext b { font-size: 16px; font-weight: 900; }
.vtext span { font-size: 12px; color: #C9C3FF; }
.vtext small { font-size: 12px; font-weight: 900; color: var(--lime); line-height: 1.4; }

/* the verdict is a luggage tag: a twisted rope through a punched hole, a hazard-stripe header, cut corners; blue when a card breaks, lime when one wakes */
.fb-tag { position: relative; width: 100%; transform-origin: 50% -190px; animation: tagSwing 1.4s cubic-bezier(.3,.6,.4,1) both; }
.fb-tag::before { content: ''; position: absolute; left: 50%; bottom: calc(100% - 66px); width: 11px; height: 560px; margin-left: -5.5px; border-radius: 5px; background: repeating-linear-gradient(40deg, #FFF 0 4px, #C9C9D2 4px 8px); }
.fb-clip { position: absolute; left: 50%; top: 48px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; border: 5px solid #111; box-sizing: border-box; z-index: 3; background: transparent; pointer-events: none; }

.fb-card { --tg: #2F5CFF; --tx: #FFF; position: relative; padding: 0; border-radius: 0; background: var(--tg); color: var(--tx); box-shadow: none; clip-path: polygon(0 11%, 11% 0, 89% 0, 100% 11%, 100% 100%, 0 100%); -webkit-mask: radial-gradient(circle 13px at 50% 66px, transparent 12px, #000 12.5px); mask: radial-gradient(circle 13px at 50% 66px, transparent 12px, #000 12.5px); }

.fb.good .fb-card .ok { background: #111; color: #FFF; }
@keyframes tagSwing { 0% { transform: rotate(-16deg); opacity: 0; } 12% { opacity: 1; } 30% { transform: rotate(10deg); } 52% { transform: rotate(-6deg); } 72% { transform: rotate(3deg); } 88% { transform: rotate(-1deg); } 100% { transform: none; } }

/* the end-of-day receipt is printed out of a kiosk slot, then stickers land on it */
.prt { position: relative; margin-top: 18px; }
.prt-plate { width: 230px; margin: 0 auto 10px; padding: 8px 12px 7px; text-align: center; background: linear-gradient(180deg, #E8E8EC, #BEBEC6); border-radius: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: 1px; color: #34343A; line-height: 1.35; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8), 0 2px 0 #8E8E96; position: relative; }
.prt-plate small { font-size: 11px; letter-spacing: 0; }
.prt-plate .led { position: absolute; left: 10px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: #3CDC6A; box-shadow: 0 0 6px #3CDC6A; animation: ledb 0.5s steps(2) 4; }
@keyframes ledb { 50% { opacity: 0.2; } }
.prt-slot { position: relative; height: 44px; border-radius: 16px; background: linear-gradient(180deg, #F0F0F3, #B7B7BF) 0 0 / 100% 44px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85), inset 0 -3px 0 #9A9AA2; }
.prt-slot::before { content: ''; position: absolute; left: 13px; right: 13px; top: 16px; height: 14px; border-radius: 4px; background: #0A0A0C; box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.9); }
/* the upper lip sits over the paper (it tucks in behind it), the lower lip sits under the paper (the paper falls over it) */
.prt-lip { position: absolute; left: 0; right: 0; top: 0; height: 20px; z-index: 4; border-radius: 16px 16px 0 0; background: linear-gradient(180deg, #F0F0F3, #B7B7BF) 0 0 / 100% 44px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.85), 0 1px 0 #8E8E96; }
/* the window starts halfway down the dark opening, so the paper comes out of the slot and falls over the faceplate */
.rcpt-win { position: relative; z-index: 3; flex-shrink: 0; margin: -40px 13px 0; padding: 0 0 14px; overflow: hidden; }
.rcpt-win .receipt { border-radius: 0; padding-top: 60px; }
.rcpt-win::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22px; z-index: 3; pointer-events: none; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 4px, rgba(0, 0, 0, 0.32) 6px, rgba(0, 0, 0, 0)); }
.rcpt-win.print .receipt { margin-bottom: 0; animation: rcPrint 2.4s cubic-bezier(.35,.9,.3,1) both, rcShake 0.07s steps(2) 30, rcWobble 0.9s ease-out 2.4s both; }
/* the paper is fed in bursts: a quick pull, a short stop, again, then it settles with a little sway */
@keyframes rcPrint { 0% { transform: translateY(-100%); } 11% { transform: translateY(-87%); } 15% { transform: translateY(-87%); } 27% { transform: translateY(-71%); } 31% { transform: translateY(-71%); } 44% { transform: translateY(-53%); } 47% { transform: translateY(-53%); } 60% { transform: translateY(-35%); } 63% { transform: translateY(-35%); } 76% { transform: translateY(-18%); } 79% { transform: translateY(-18%); } 92% { transform: translateY(-3%); } 100% { transform: none; } }
@keyframes rcShake { 50% { translate: 0.7px 0; } }
@keyframes rcWobble { 0% { rotate: 0deg; transform-origin: 50% 0; } 25% { rotate: -1.6deg; } 55% { rotate: 1deg; } 80% { rotate: -0.4deg; } 100% { rotate: 0deg; } }
.rcpt-win.print ~ * { }
.prt-slot::before { animation: slotLit 2.4s ease-out both; }
@keyframes slotLit { 0%, 100% { box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.9); } 10%, 90% { box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.9), 0 6px 10px rgba(255, 236, 150, 0.7); } }
.print .receipt .stamp { animation: slam 0.4s cubic-bezier(.3,1.8,.5,1) both 2.55s; }
@keyframes slam { from { transform: scale(2.6) rotate(-24deg); opacity: 0; } }
.rfoot { position: relative; height: 92px; margin-top: 8px; }
.rs { position: absolute; display: block; transform: rotate(var(--r, 0deg)); }

.rs-bar { left: 0; top: 6px; padding: 6px 8px 4px; background: #FFD92E; border: 2px solid #111; border-radius: 3px; }
.rs-bar .bars { display: flex; gap: 1.5px; height: 34px; align-items: stretch; } .rs-bar .bars i { background: #111; display: block; }
.rs-bar small { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 1px; color: #111; }
.rs-smile { left: 150px; top: 0; }

/* confirm buttons: one place on every sheet, the same as the launch screen */
.sfoot { position: sticky; bottom: -24px; z-index: 4; margin: auto -18px -24px; padding: 14px 24px 84px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, rgba(255,255,255,0), #FFF 22%); }

/* piggy bank in the spend card */

.pc { display: block; width: 44px; height: 12px; margin-top: -3px; border-radius: 50%; background: radial-gradient(ellipse at 40% 35%, #FFF3A0, #FFC81E 60%, #D9961A); box-shadow: 0 2px 0 #B87812, inset 0 0 0 1.5px rgba(255, 255, 255, 0.5); transform: translateX(var(--w, 0)); animation: coinIn 0.5s cubic-bezier(.3,1.7,.5,1) both calc(var(--i, 0) * 60ms); }

.screen:has(> .head) .hero.over .money { font-size: 64px; }

/* retro CRT in the spend card */

.crt-scr::before { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px); }
.crt-ttl { font-family: var(--f-px); font-size: 12px; letter-spacing: 3px; color: #B35C84; }
.crt-money { font-family: var(--f-px); font-weight: 600; font-size: 44px; line-height: 1.1; color: #FF9CC4; text-shadow: 0 0 6px #FF4FA0, 0 0 18px rgba(255, 79, 160, 0.8); animation: crtGlow 3s ease-in-out infinite; }
@keyframes crtGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.88; } 52% { opacity: 1; } }

function firstHand() {
  const picks = [...new Set(S.weak.map(id => WEAK.find(w => w.id === id).card))].filter(no => S.unlocked.includes(no));

// without any, pick the easiest set. A carried card always stays in the set

  const combos = [];

  const value = c => hasData ? simulate(c, S.lastWeek, S.weekStart).total : -c.reduce((a, no) => a + CARDS[no].diff * 10 - CARDS[no].plus, 0);
  return ok.sort((a, b) => value(b) - value(a))[0] || combos[0] || hand.slice(0, n);

/* ---------- monthly review ---------- */
const HABITS = [
  { name: 'Takeout', test: x => x.cat === 'takeout' }, { name: 'Tea & Coffee', test: x => x.cat === 'tea' }, { name: 'Taxi', test: x => x.cat === 'taxi' },
  { name: 'Online', test: x => x.cat === 'online' }, { name: 'Ordered after 10 pm', test: x => !!x.night }
];
function monthStats(y, m) {
  const recs = S.history.map(h => ({ h, d: dateOf(h.week, h.day) })).filter(o => o.d.getFullYear() === y && o.d.getMonth() === m);
  const spent = recs.reduce((a, o) => a + o.h.extra, 0), allowed = dailyBudget() * recs.length;
  const cards = {};
  recs.forEach(o => o.h.cards.forEach(c => { const k = cards[c.no] || (cards[c.no] = { held: 0, days: 0 }); k.days++; if (c.state === 'on') k.held++; }));
  const weeks = [...new Set(recs.map(o => o.h.week))].sort((a, b) => a - b);
  // habits as "times per week", so a 4-day first week compares fairly with a full one
  const rate = (w, test) => { const days = recs.filter(o => o.h.week === w); return days.length ? Math.round(days.reduce((a, o) => a + o.h.entries.filter(test).length, 0) / days.length * 7 * 10) / 10 : 0; };
  // a week with only a day or two in this month says too little, so compare weeks with at least three days
  const full = weeks.filter(w => recs.filter(o => o.h.week === w).length >= 3);
  const habits = full.length > 1 ? HABITS.map(hb => ({ name: hb.name, first: rate(full[0], hb.test), last: rate(full[full.length - 1], hb.test) })).filter(hb => hb.first || hb.last) : [];
  const best = recs.slice().sort((a, b) => b.h.score - a.h.score)[0];
  return {
    recs, full, days: recs.length, spent, allowed, score: recs.reduce((a, o) => a + o.h.score, 0), zero: recs.filter(o => o.h.extra === 0).length,
    allHeld: recs.filter(o => o.h.cards.every(c => c.state === 'on')).length, cards, weeks, habits, best,
    settled: (S.weeks || []).filter(w => weeks.includes(w.week)).length, passes: (S.weeks || []).filter(w => weeks.includes(w.week) && w.pass).length, stars: (S.weeks || []).filter(w => weeks.includes(w.week)).reduce((a, w) => a + w.stars, 0),
    grads: (S.gradLog || []).filter(g => g.date.getFullYear() === y && g.date.getMonth() === m)
  };
}
function reviewHTML(y, m) {
  const st = monthStats(y, m);
  if (!st.days) return '<p class="note">No day has been ended this month yet. Tonight, tap "End today" and data will start showing up here.</p>';
  const saved = st.allowed - st.spent;
  const cap = (outer, face, label, value) => `<div class="cap" style="height:76px;background:${outer}"><div class="top" style="background:${face};padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-size:11px;font-weight:900">${label}</span><span class="px" style="font-size:20px;font-weight:600">${value}</span></div></div>`;
  const cardRows = Object.entries(st.cards).sort((a, b) => b[1].held / b[1].days - a[1].held / a[1].days).map(([no, k]) => `<div class="hrow"><span class="hico" style="background:${tintOf(no)}">${artIcon(no, 26)}</span><span><b>${CARDS[no].name}</b><i style="width:${Math.round(k.held / k.days * 100)}%;background:${coreOf(no)}"></i></span><span class="px">${k.held}/${k.days} days${S.grad.includes(no) ? ' · Graduated' : ''}</span></div>`).join('');
  const habits = st.full.length > 1 && st.habits.length
    ? st.habits.map(hb => { const d = hb.last - hb.first; return `<div class="trend ${d < 0 ? 'down' : d > 0 ? 'up' : ''}"><b>${hb.name}</b><span class="px">Weekly ${hb.first} × → ${hb.last} ×</span><em>${d < 0 ? `Down ${Math.round(-d * 10) / 10} ×` : d > 0 ? `Up ${Math.round(d * 10) / 10} ×` : 'No change'}</em></div>`; }).join('')
    : `<p class="note left">${st.full.length > 1 ? 'No takeout, milk tea, taxi, online or late-night spending was logged this month.' : 'You need two weeks with 3+ logged days to compare; log a few more days.'}</p>`;
  return `
    <div class="mhero ${saved >= 0 ? '' : 'over'}"><span class="px">${MON[m]} · ${st.days} days logged</span><b>${saved >= 0 ? 'Saved' : 'Over'} ¥${Math.abs(saved)}</b><small>Spent outside the allowance ¥${st.spent}, across these ${st.days} days you could spend ¥${st.allowed}</small></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      ${cap('#B7B0F0', 'linear-gradient(180deg,#ECEAFF 0%,#DCD8FF 100%)', 'Daily avg outside allowance', `¥${Math.round(st.spent / st.days)}`)}
      ${cap('#B8D000', 'linear-gradient(180deg,#F2FF7A 0%,#E4FF1A 100%)', 'Zero-spend days', `${st.zero} days`)}
      ${cap('#D12E2E', 'linear-gradient(180deg,#FF7A7A 0%,#FF4B4B 100%)', 'All 3 held', `${st.allHeld} days`)}
    </div>
    <div class="impact">
      <div class="r"><span>Score this month</span><span>${st.score} pts</span></div>
      <div class="r"><span>Passed</span><span>${st.settled ? `${st.passes} / ${st.settled} ${st.stars ? ` · ★ ${st.stars}` : ''}` : 'This week isn’t over yet'}</span></div>
      ${st.best ? `<div class="r"><span>Best day</span><span>${MON[st.best.d.getMonth()]} ${st.best.d.getDate()} · ${st.best.h.score} pts</span></div>` : ''}
    </div>
    <h2>Have your habits changed? <small>First week → last week</small></h2>
    ${habits}
    <h2>Days each card held</h2>
    <div class="hrows">${cardRows}</div>
    ${st.grads.map(g => `<div class="gradcard"><div class="gimg">${scaled(CARDS[g.no], 0.3)}<span class="cv-grad">Graduated</span></div><div><b>Graduated this month: ${CARDS[g.no].name}</b><p>Held 6/7 days or more for ${GRAD_WEEKS} weeks in a row; base mult +1.</p></div></div>`).join('')}`;
}
// the first morning of a new month opens last month's review on top of whatever is showing
function monthTurn(prev, now) {

/* ---------- the two daily moments ---------- */
// heads-ups before the money goes out, one per held card, by time of day and state
function alerts(ev) {
  const c = S.clock, out = [];
  ev.cards.forEach(x => {
    const k = CARDS[x.no];
    if (x.state === 'pending') { out.push(`${k.name} is still asleep: log one entry today to wake it (+${k.plus}).`); return; }
    if (x.state !== 'on') return;
    if (x.near) { out.push(x.near + '.'); return; }
    if (x.no === '01' && ((c >= 11 && c < 13.5) || (c >= 17 && c < 19.5))) out.push(`Mealtime: order takeout and Takeout Nemesis breaks, mult − ${k.plus}.`);
    if (x.no === '06' && c >= 21 && c < 22) out.push(`In ${Math.round((22 - c) * 60)} min it’s 10 pm; after that, one cent breaks Night Cat.`);
    if (x.no === '06' && c >= 22) out.push('It’s past 10 pm; spending now breaks Night Cat (−2). Put what you want on the wish list.');
    if (x.no === '04' && ((c >= 7.5 && c < 9.5) || c >= 22)) out.push('Want a taxi? Walker breaks (−1); the subway counts as commuting and is fine.');
    if (x.no === '07' && c >= 20) out.push('Evenings are when you order most: wish list first; buying on the spot breaks Cool-Off (−2).');
    if (x.no === '05') out.push(`Zero Day is still alive (+${k.plus}): spend nothing outside the allowance today to earn it.`);
  });
  return out;
}
// when the day is lost on the game side, say what is still worth doing so people keep logging

const BELL = '<svg width="20" height="20" viewBox="0 0 20 20" fill="#E4FF1A" aria-hidden="true"><path d="M10 2a5 5 0 0 0-5 5v3.5L3.5 14h13L15 10.5V7a5 5 0 0 0-5-5zM8 15.5a2 2 0 0 0 4 0z"/></svg>';

}

function rollShop() {
  const locked = Object.values(CARDS).filter(c => !S.unlocked.includes(c.no) && !S.grad.includes(c.no)).map(c => ({ no: c.no, kind: 'unlock', price: Math.max(1, Math.round(c.unlock / 2)) }));
  const pins = S.unlocked.filter(no => no !== S.carry && !S.pinned.includes(no)).map(no => ({ no, kind: 'pin', price: 1 }));
  const all = [...locked, ...pins.sort(() => Math.random() - 0.5)];
  // keep the recommended card on the shelf whenever it can be sold at all
  const rec = shopPick(), ri = rec ? all.findIndex(o => o.no === rec.no) : -1;

/* ---------- day flow ---------- */
function endDay() {
  const h = dayRecord();
  S.history.push(h);
  const owed = Math.max(0, h.extra + S.debt - dailyBudget());
  S.debt = Math.min(debtCap(), owed);
  // whatever tomorrow can't absorb raises this week's target: every yuan still has to be won back by saving
  h.overflow = owed - S.debt; S.overflow = (S.overflow || 0) + h.overflow;
  S.teaWeek += teaOf(S.today);
  S.revisit = S.wish; S.wish = [];
  S.today = [];
  if (S.day === 6) { settleWeek(); renderTable(); renderWeek(); return; }
  S.day += 1; S.clock = 8.5;
  renderTable();
  if (S.prefs.morning) renderMorning(); else toast(`${DAYS[S.day]} · allowed today ¥${todayBudget()}`);
  monthTurn(dateOf(S.week, S.day - 1), dateOf(S.week, S.day));
}
function startWeek() {
  const lastDay = dateOf(S.week, 6);
  S.lastWeek = DAYS.map((_, i) => (weekHist().find(h => h.day === i) || { entries: [] }).entries.map(x => ({ ...x })));
  S.lastDays = weekDays();
  S.autoEnded = false; S.clock = 8.5;
  // an overspent Sunday still comes out of Monday's allowance, so the week boundary is no free night out
  S.stake = S.nextStake; S.overflow = 0;
  if (S.slotPending) { S.slots = 4; S.slotPending = false; }
  S.week += 1; S.day = 0; S.weekStart = 0; S.held = []; S.teaWeek = 0; S.firstDraw = false; S.estimated = false;
  draft = {};
  renderTable(); renderDraw();
  monthTurn(lastDay, dateOf(S.week, 0));
}

  if (t.dataset.evat) { S.prefs.eveningAt = +t.dataset.evat; replaceSheet(top, renderSettings); return; }
  if (act === 'settings-save') { S.base = weeklyFrom(S.setup); replaceSheet(top, renderSettings); toast(`Weekly allowance set to ¥${S.base}, ¥${dailyBudget()}`); return; }
  if (act === 'coach-reset') { S.coach = 0; S.view = 'home'; top.remove(); renderTable(); return; }
  if (act === 'restart') { location.reload(); return; }
  if (act === 'star') { renderStarSheet(); return; }
  // settings can change what home shows, so redraw it on the way out
  if (act === 'close') { const lbl = top.getAttribute('aria-label'); top.remove(); if (lbl === 'Settings') { renderTable(); } return; }
  if (act === 'draw') { draft = {}; renderDraw(); return; }
  if (t.dataset.pick) {
    if (draft.swiped) return;
    const no = t.dataset.pick, inHand = draft.hand.filter(x => !draft.sel.includes(x)), i = inHand.indexOf(no);
    // a side card comes to the front first; the front card is the one you keep
    if (i !== draft.ci) { draft.ci = i; glide(top.querySelector('.stack'), i, 0, () => replaceSheet(top, renderDraw)); return; }
    if (!keepFront(top, t.closest('.sc2'))) replaceSheet(top, renderDraw);
    return;
  }
  if (t.dataset.unpick) { const no = t.dataset.unpick; draft.sel = draft.sel.filter(x => x !== no); draft.ci = draft.hand.filter(x => !draft.sel.includes(x)).indexOf(no); replaceSheet(top, renderDraw); return; }
  if (act === 'use-rec') { draft.sel = draft.rec.slice(); draft.ci = 0; draft.landed = 'all'; draft.opened = true; replaceSheet(top, renderDraw); return; }
  if (act === 'choose') { keepHand(top); return; }
  if (t.dataset.day) { renderDay(+t.dataset.day); return; }
  if (act === 'log') { if (!S.held.length) { toast('Draw this week’s cards first'); return; } draft = { amt: '', cat: 'takeout', night: S.clock >= 22, note: '' }; renderLog(); return; }
  if (act === 'clock') { renderClock(); return; }
  // demo shortcut: end every remaining weekday as it stands, land on Sunday evening
  if (act === 'jump-sunday') {
    top.remove();
    while (S.day < 6) endDay();
    app.querySelectorAll('.sheet').forEach(n => n.remove());
    S.clock = 21.5; S.view = 'home'; renderTable();
    toast('It’s Sunday night; tap “End today” for the weekly summary');
    return;
  }
  if (t.dataset.clock) {
    top.remove();
    if (t.dataset.clock === 'midnight') { S.autoEnded = true; endDay(); return; }
    const before = alerts(evaluate(S.today))[0];
    S.clock = +t.dataset.clock; renderTable();
    const a = alerts(evaluate(S.today))[0];
    if (S.prefs.evening && S.clock >= S.prefs.eveningAt) pushNote('Done logging?', `It’s ${fmtClock(S.clock)}, tonight’s estimate ${evaluate(S.today).score} pts. When you’re done, tap "End today" pts. When you’re done, tap “End today” and look at the receipt.`);
    else if (S.prefs.ruleAlerts && a && a !== before) pushNote('Your cards', a);
    return;
  }
  if (t.dataset.rv) {
    const [i, how] = t.dataset.rv.split(':'), x = S.revisit.splice(+i, 1)[0];
    let msg;
    if (how === 'buy') { S.today.push({ ...x, night: false, fromWish: true }); msg = 'Logged · wait 24 hours before buying'; }
    else { S.wishSaved = (S.wishSaved || 0) + x.amt; msg = `Skip it, saved ¥${x.amt}`; }
    const lbl = top.getAttribute('aria-label'); renderTable(); (lbl === 'Notifications' ? renderInbox : renderMorning)(); lastSheet().style.animation = 'none'; toast(msg); return;
  }
  if (act === 'morning-done') { S.autoEnded = false; S.wishSaved = 0; top.remove(); renderTable(); return; }
  if (act === 'push-close') { t.closest('.push').remove(); return; }
  if (t.dataset.edit) { const i = +t.dataset.edit, x = S.today[i]; draft = { amt: String(x.amt), cat: x.cat, night: !!x.night, note: x.note || '', edit: i, fromWish: x.fromWish }; renderLog(); return; }
  if (t.dataset.hquick) { if (!S.held.length) { toast('Draw this week’s cards first'); return; } const q = S.quicks[+t.dataset.hquick]; draft = { amt: '', cat: q.cat, night: S.clock >= 22, note: q.label === cat(q.cat).name ? '' : q.label }; renderLog(); return; }
  if (t.dataset.quick) { const q = S.quicks[+t.dataset.quick]; Object.assign(draft, { cat: q.cat, note: q.label === cat(q.cat).name ? '' : q.label }); refreshLog(); return; }
  if (t.dataset.cat) { draft.cat = t.dataset.cat; refreshLog(); return; }
  if (t.dataset.night) { draft.night = t.dataset.night === '1'; refreshLog(); return; }
  if (t.dataset.delivery) { draft.delivery = t.dataset.delivery === '1'; refreshLog(); return; }
  if (t.dataset.newess) { draft.newEss = t.dataset.newess === '1'; refreshLog(); return; }
  if (t.dataset.key) { const k = t.dataset.key; draft.amt = k === 'C' ? '' : k === '⌫' ? draft.amt.slice(0, -1) : (draft.amt + k).replace(/^0+/, '').slice(0, 4); refreshLog(); return; }
  if (act === 'newcat') { draft.adding = !draft.adding; refreshLog(); return; }
  if (act === 'addcat') {
    if (!draft.newName) { toast('Give the new category a name first'); return; }
    const id = 'u' + Date.now();
    CATS.push({ id, name: draft.newName, ess: !!draft.newEss });
    Object.assign(draft, { cat: id, adding: false, newName: '', newEss: false });
    refreshLog(); toast(`Added: ${cat(id).name}`); return;
  }
  if (act === 'savequick') {
    const label = draft.note || cat(logCat()).name;
    if (!S.quicks.some(q => q.label === label && q.cat === logCat())) { S.quicks.unshift({ label, cat: logCat() }); S.quicks = S.quicks.slice(0, 8); }
    refreshLog(); toast(`Saved: ${label}, tap it next time and just enter the amount`); return;
  }
  if (act === 'save') {
    const entry = { cat: logCat(), amt: parseInt(draft.amt, 10), night: !!draft.night, note: draft.note, fromWish: draft.fromWish };
    const before = evaluate(S.today);
    if (draft.edit != null) S.today[draft.edit] = entry; else S.today.push(entry);
    renderTable(); verdict(before, evaluate(S.today)); return;
  }
  if (act === 'del') { const before = evaluate(S.today); S.today.splice(draft.edit, 1); renderTable(); const after = evaluate(S.today); toast(after.mult > before.mult ? `Deleted · mult back to ×${after.mult}` : 'Deleted'); return; }
  if (act === 'wish') { S.wish.push({ cat: logCat(), amt: parseInt(draft.amt, 10), note: draft.note }); renderTable(); toast('Moved to the wish list; we’ll ask again tomorrow · no card broke'); return; }
  if (act === 'wish-buy') { const x = S.revisit.shift(); const before = evaluate(S.today); S.today.push({ ...x, night: false, fromWish: true }); renderTable(); verdict(before, evaluate(S.today)); return; }
  if (act === 'wish-skip') { const x = S.revisit.shift(); renderTable(); toast(`saved ¥${x.amt}`); return; }
  if (act === 'end') { if (!S.held.length) { toast('Draw this week’s cards first'); return; } renderEnd(); return; }
  if (act === 'end-ok') { t.disabled = true; playStage(top); return; }
  if (act === 'play-next') { t.disabled = true; endDay(); return; }
  if (act === 'unlogged-yes' || act === 'unlogged-no') {
    const y = S.history[S.history.length - 1];
    if (act === 'unlogged-yes') Object.assign(y, y.potential, { unlogged: false });
    y.resolved = true;
    renderTable(); renderMorning(); lastSheet().style.animation = 'none';
    toast(act === 'unlogged-yes' ? `Filled in ${y.score} pts` : 'That day counts as 0 pts. Log a quick entry whenever you spend later');
    return;
  }
  if (act === 'recon' || act === 'recon-skip') {
    const R = S.weekResult, actual = parseInt((top.querySelector('#recon') || {}).value, 10);
    if (act === 'recon' && !(actual >= 0)) { toast('Enter what you really spent this week first'); return; }
    const voided = act === 'recon' && actual > R.logged * RECON_RATIO && actual - R.logged > RECON_SLACK ? R.got : 0;
    const lost = act === 'recon-skip' ? R.got - Math.floor(R.got / 2) : voided;
    S.stars -= lost; S.starsTotal -= lost; R.got -= lost; S.weeks[S.weeks.length - 1].stars = R.got; S.lastResult.stars = R.got;
    R.recon = { actual, voided, skipped: act === 'recon-skip' };
    replaceSheet(top, renderWeek); return;
  }
  if (act === 'to-monday') { top.remove(); S.clock = 8.5; renderMonday(); return; }
  if (act === 'shop') { rollShop(); top.remove(); renderShop(); return; }
  if (act === 'draw-now') { top.remove(); startWeek(); S.pinned = []; return; }
  if (t.dataset.buy) {
    const o = S.shopOffers[+t.dataset.buy]; if (o.sold || S.stars < o.price) return;
    S.stars -= o.price; o.sold = true;
    if (o.kind === 'unlock') S.unlocked.push(o.no); else S.pinned.push(o.no);
    shopRe(top); toast(o.kind === 'unlock' ? `Unlocked “${CARDS[o.no].name}”` : `Guaranteed next week: “${CARDS[o.no].name}”`); return;
  }
  if (act === 'reroll') { S.stars -= PRICE.reroll; rollShop(); shopRe(top); return; }
  if (act === 'slot') { S.stars -= PRICE.slot; if (top) S.slots = 4; else S.slotPending = true; shopRe(top); toast('From next week: 6 dealt, keep 4, target +25%'); return; }
  if (act === 'glue-buy') { S.stars -= PRICE.glue; S.glue += 1; shopRe(top); toast('Bought a bottle of glue; tap a broken card to use it'); return; }
  if (act === 'shop-done') { startWeek(); S.pinned = []; return; }
  if (act === 'glue') {
    const no = t.dataset.no; S.glue -= 1; S.glued = { week: S.week, day: S.day, no };
    top.remove(); renderTable(); toast(`Glued back, “${CARDS[no].name}” holds again today +${CARDS[no].plus}`); return;
  }
  if (t.dataset.carry) { S.carry = t.dataset.carry; replaceSheet(top, renderWeek); return; }
  if (t.dataset.stake) { S.nextStake = +t.dataset.stake; replaceSheet(top, renderWeek); return; }
  if (act === 'next-week') { startWeek(); return; }
});

renderTable();
renderLaunch();
</script>
